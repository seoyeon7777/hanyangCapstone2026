<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>피팅 결과</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --border: #e0dbd4;
      --text: #1a1a1a;
      --muted: #8a8480;
      --accent: #6abf69;
      --accent-light: #f0f7f0;
      --good: #2e7d32;
      --good-bg: #f0f7f0;
      --warn: #e65100;
      --warn-bg: #fff3e0;
      --shadow: 0 2px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.10);
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px 60px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar-card {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .avatar-figure {
      width: 100%;
      height: 550px;
      margin-bottom: 12px;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    /* ── 로딩 오버레이 ── */
    .loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      height: 100%;
    }

    .spinner-wrap {
      position: relative;
      width: 64px;
      height: 64px;
    }

    /* 바깥 링 */
    .spinner-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid var(--border);
    }

    /* 돌아가는 링 */
    .spinner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }


    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-texts {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .loading-main {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .loading-percent {
      font-family: 'DM Sans', sans-serif;
      font-size: 42px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 4px;
    }
    .loading-percent span {
      font-size: 18px;
      font-weight: 400;
      color: var(--muted);
      margin-left: 2px;
    }

    .loading-bar-track {
      width: 160px;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .loading-sub {
      font-size: 12px;
      color: var(--muted);
    }

    /* 단계별 진행 점 */
    .loading-steps {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .step-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    .step-dot:nth-child(1) { animation-delay: 0s; }
    .step-dot:nth-child(2) { animation-delay: 0.25s; }
    .step-dot:nth-child(3) { animation-delay: 0.5s; }

    @keyframes pulse-dot {
      0%, 80%, 100% { background: var(--border); transform: scale(1); }
      40% { background: #6abf69; transform: scale(1.4); }
    }

    /* 진행 단계 텍스트 순환 */
    .loading-step-label {
      font-size: 11px;
      color: var(--accent);
      height: 16px;
      overflow: hidden;
      position: relative;
    }

    .step-text {
      position: absolute;
      left: 0; right: 0;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s, transform 0.4s;
    }
    .step-text.active {
      opacity: 1;
      transform: translateY(0);
    }
    /* ────────────────── */

    .view-btn-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .view-btn {
      padding: 8px 18px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-btn:hover { background: var(--bg); }
    .view-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .card {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 18px;
      color: var(--text);
    }

    .review-box {
      background: var(--accent-light);
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 13.5px;
      line-height: 1.8;
      color: #1a3d1a;
    }

    .model-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .model-item {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .model-item.active {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .model-size-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
    }

    .model-item.active .model-size-badge {
      background: var(--accent);
      color: #fff;
    }

    .model-size-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .model-size-info {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .model-item.active .model-size-info { color: #1a3d1a; }

    .my-info-box {
      background: var(--bg);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .my-info-box span.val { color: var(--text); font-weight: 500; }
    .my-info-box span.size-val { color: var(--accent); font-weight: 600; }

    .spec-diagram { display: flex; justify-content: center; margin-bottom: 20px; }
    .spec-diagram svg { width: 180px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--bg); padding: 10px 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--border); text-align: center; }
    td { padding: 9px 12px; border: 1px solid var(--border); text-align: center; color: var(--text); }
    tr:nth-child(even) td { background: var(--bg); }
    tr.highlight td { background: var(--accent-light); font-weight: 500; }

    .btn {
      padding: 15px;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
    .btn-secondary:hover { background: var(--bg); }
  </style>
</head>
<body>
<div class="container">

  <!-- 아바타 + 피팅 점수 -->
  <div class="avatar-card">
    <div class="avatar-figure" id="avatarFigure">

      <!-- 로딩 오버레이 -->
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-wrap">
          <div class="spinner"></div>
        </div>
        <div class="loading-texts">
          <p class="loading-percent" id="loadingPercent">0<span>%</span></p>
          <p class="loading-main" id="loadingMain">체형 분석 중...</p>
          <div class="loading-bar-track">
            <div class="loading-bar-fill" id="loadingBar"></div>
          </div>
          <div class="loading-step-label" id="stepLabel">
            <span class="step-text active" id="step0">체형 분석 중...</span>
            <span class="step-text" id="step1">의류 형태 적용 중...</span>
            <span class="step-text" id="step2">물리 시뮬레이션 중...</span>
            <span class="step-text" id="step3">렌더링 중...</span>
          </div>
        </div>
      </div>

    </div>

    <div class="view-btn-group" id="viewBtnGroup" style="display:none;">
      <button onclick="changeView('front')" id="btn-front" class="view-btn active">정면</button>
      <button onclick="changeView('left')"  id="btn-left"  class="view-btn">왼쪽</button>
      <button onclick="changeView('back')"  id="btn-back"  class="view-btn">뒷면</button>
      <button onclick="changeView('right')" id="btn-right" class="view-btn">오른쪽</button>
    </div>

  </div>

  <!-- 총평 -->
  <div class="card" id="analysis-card" style="display:none;">
    <p class="card-title">총평</p>
    <div class="review-box" id="reviewText"></div>
  </div>

  <!-- 모델 정보 -->
  <div class="card">
    <p class="card-title">모델 정보</p>
    <div class="model-grid">
      <div class="model-item" id="model-S">
        <div class="model-size-badge">S</div>
        <div class="model-size-label">S 사이즈</div>
        <div class="model-size-info">157cm 이하</div>
      </div>
      <div class="model-item" id="model-M">
        <div class="model-size-badge">M</div>
        <div class="model-size-label">M 사이즈</div>
        <div class="model-size-info">158 ~ 168cm</div>
      </div>
      <div class="model-item" id="model-L">
        <div class="model-size-badge">L</div>
        <div class="model-size-label">L 사이즈</div>
        <div class="model-size-info">169cm 이상</div>
      </div>
    </div>
    <div class="my-info-box">
      <span>내 정보</span>
      <span class="val" id="myHeight"></span>
      <span class="val" id="myWeight"></span>
      <span class="size-val" id="mySize"></span>
    </div>
  </div>

  <!-- 제품 상세정보 -->
  <div class="card">
    <p class="card-title">제품 상세정보</p>
    <div class="spec-diagram">
      <img id="productImage" style="width:60%; max-width:260px; border-radius:8px;" />
    </div>
    <table>
      <thead id="sizeTableHead">
        <tr><th>사이즈</th><th>어깨너비</th><th>소매길이</th><th>가슴둘레</th><th>총기장</th></tr>
      </thead>
      <tbody id="sizeTable">
        <tr><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card" id="meta-card" style="display:none;">
    <p class="card-title">품질 · 아티팩트</p>
    <div id="qaBadge" style="font-size:12px;margin-bottom:10px;"></div>
    <div id="classInfo" style="font-size:12px;color:var(--muted);margin-bottom:8px;"></div>
    <div id="sourceInfo" style="font-size:12px;color:var(--muted);margin-bottom:12px;"></div>
    <div id="downloadLinks" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
    <button class="btn btn-secondary" id="retryReviewBtn" style="display:none;width:100%;margin-top:12px;" onclick="retryJob(window.__jobId)">검수 후 다시 시도</button>
  </div>

  <div style="margin-top: 8px;">
    <button class="btn btn-secondary" style="width:100%;" onclick="window.location.href='/'">다시하기</button>
  </div>

</div>

<script>
  const params   = new URLSearchParams(window.location.search);
  const height   = parseFloat(params.get('height')) || 165;
  const weight   = parseFloat(params.get('weight')) || 60;
  const gender   = params.get('gender') || 'female';
  const type   = params.get('type') || 'tshirt';
  const fabric = JSON.parse(params.get('fabric') || '{}');
  const jobIdParam = params.get('job_id');
  const mode = params.get('mode') || (jobIdParam ? 'pipeline' : 'legacy');

  const shoulder = parseFloat(params.get('shoulder')) || 0;
  const sleeve   = parseFloat(params.get('sleeve'))   || 0;
  const chest    = parseFloat(params.get('chest'))    || 0;
  const length   = parseFloat(params.get('length'))   || 0;
  const waist    = parseFloat(params.get('waist'))    || 0;
  const hip      = parseFloat(params.get('hip'))      || 0;
  const inseam   = parseFloat(params.get('inseam'))   || 0;

  let imageBase = '';
  window.__jobId = jobIdParam;

  document.getElementById('productImage').src = '/static/images/top_info.png';
  document.getElementById('myHeight').textContent = `키 ${height}cm`;
  document.getElementById('myWeight').textContent = `몸무게 ${weight}kg`;

  if (type === 'pants') {
    document.getElementById('sizeTableHead').innerHTML = `<tr><th>허리</th><th>엉덩이</th><th>인심</th><th>총기장</th></tr>`;
    document.getElementById('sizeTable').innerHTML = `
      <tr>
        <td>${waist || '-'}</td>
        <td>${hip || '-'}</td>
        <td>${inseam || '-'}</td>
        <td>${length || '-'}</td>
      </tr>`;
  } else {
    document.getElementById('sizeTableHead').innerHTML = `<tr><th>어깨너비</th><th>소매길이</th><th>가슴둘레</th><th>총기장</th></tr>`;
    document.getElementById('sizeTable').innerHTML = `
      <tr>
        <td>${shoulder || '-'}</td>
        <td>${sleeve   || '-'}</td>
        <td>${chest    || '-'}</td>
        <td>${length   || '-'}</td>
      </tr>`;
  }

  function toPublicPath(p) {
    if (!p) return null;
    const s = String(p).replace(/\\\\/g, '/');
    const idx = s.lastIndexOf('/outputs/');
    if (idx >= 0) return s.slice(idx);
    if (s.includes('outputs/')) {
      return '/' + s.slice(s.indexOf('outputs/'));
    }
    if (jobIdParam && !s.startsWith('/')) {
      const base = s.split(/[\\\\/]/).pop();
      return `/outputs/${jobIdParam}/${base}`;
    }
    return s.startsWith('/') ? s : null;
  }

  function showMetaPanel(result) {
    const card = document.getElementById('meta-card');
    card.style.display = '';
    const qa = result.qa || {};
    const badge = document.getElementById('qaBadge');
    if (qa.passed === false || result.status === 'needs_review') {
      badge.innerHTML = `<span style="background:var(--warn-bg);color:var(--warn);padding:4px 10px;border-radius:8px;">검수 필요</span>`;
      document.getElementById('retryReviewBtn').style.display = '';
    } else {
      badge.innerHTML = `<span style="background:var(--good-bg);color:var(--good);padding:4px 10px;border-radius:8px;">QA 통과</span>`;
    }
    const fit = result.fit || {};
    const clf = fit.classification || {};
    if (clf.label) {
      document.getElementById('classInfo').textContent =
        `분류: ${clf.label} (${Math.round((clf.confidence || 0) * 100)}%, ${clf.source || ''})`;
    }
    const sources = fit.measurement_sources || {};
    if (Object.keys(sources).length) {
      document.getElementById('sourceInfo').textContent =
        '치수 소스: ' + Object.entries(sources).map(([k, v]) => `${k}=${v}`).join(', ');
    }
    const arts = result.artifacts || {};
    const links = [];
    const glb = toPublicPath(arts.glb);
    const sim = toPublicPath(arts.simulated_obj);
    const sil = toPublicPath(arts.cloth_silhouette_obj);
    const albedo = toPublicPath(arts.texture || arts.albedo);
    if (glb) links.push(`<a class="btn btn-secondary" style="padding:8px 12px;font-size:12px;text-decoration:none;" href="${glb}" download>GLB 다운로드</a>`);
    if (sim) links.push(`<a class="btn btn-secondary" style="padding:8px 12px;font-size:12px;text-decoration:none;" href="${sim}" download>시뮬 OBJ</a>`);
    if (sil) links.push(`<a class="btn btn-secondary" style="padding:8px 12px;font-size:12px;text-decoration:none;" href="${sil}" download>실루엣 OBJ</a>`);
    if (albedo) links.push(`<a class="btn btn-secondary" style="padding:8px 12px;font-size:12px;text-decoration:none;" href="${albedo}" download>텍스처</a>`);
    document.getElementById('downloadLinks').innerHTML = links.join('') || '<span style="font-size:12px;color:var(--muted);"></span>';
  }
  window.changeView = function(view) {
    if (!imageBase) return;
    const img = document.getElementById('avatarImg');
    if (img) img.src = imageBase + `silhouette_${view}.png`;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${view}`).classList.add('active');
  };

  function highlightAvatar(size) {
    document.querySelectorAll('.model-item').forEach(el => el.classList.remove('active'));
    const activeModel = document.getElementById(`model-${size}`);
    if (activeModel) activeModel.classList.add('active');
    document.getElementById('mySize').textContent = size ? `→ ${size} 사이즈 모델` : '';
  }

  function showSilhouettes(frontUrl) {
    imageBase = frontUrl.replace('silhouette_front.png', '');
    const overlay = document.getElementById('loadingOverlay');
    overlay.style.transition = 'opacity 0.4s';
    overlay.style.opacity = '0';
    setTimeout(() => {
      document.getElementById('avatarFigure').innerHTML = `
        <img id="avatarImg"
             src="${frontUrl}"
             style="width:100%;height:100%;object-fit:contain;"
             alt="아바타" />
      `;
    }, 400);
    document.getElementById('viewBtnGroup').style.display = '';
    document.getElementById('analysis-card').style.display = '';
  }

  function showReview(fitAnalysis, summary, warnings) {
    let html = '';
    if (fitAnalysis && Array.isArray(fitAnalysis) && fitAnalysis.length > 0) {
      html += fitAnalysis.map(s => `<p style="margin-bottom:6px;line-height:1.7;">✔ ${String(s).replace(/\.$/,'')}</p>`).join('');
    } else if (summary) {
      html += `<p style="margin-bottom:6px;line-height:1.7;">${summary}</p>`;
    }
    if (warnings && warnings.length) {
      html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid #d7e5d7;">
        ${warnings.slice(0, 6).map(w => `<p style="margin-bottom:4px;font-size:12px;color:#5a6a5a;">⚠ ${w}</p>`).join('')}
      </div>`;
    }
    document.getElementById('reviewText').innerHTML = html || '';
  }

  let currentPercent = 0;

  function setProgressUI(pct, message) {
    if (typeof pct === 'number' && !Number.isNaN(pct)) {
      currentPercent = Math.max(currentPercent, Math.min(100, Math.round(pct)));
      document.getElementById('loadingPercent').innerHTML =
        `${currentPercent}<span>%</span>`;
      document.getElementById('loadingBar').style.width = currentPercent + '%';
    }
    if (message) {
      document.getElementById('loadingMain').textContent = message;
    }
  }

  const LEGACY_PCT = {
    '체형 분석 중...': 10,
    '입력 검증 중...': 5,
    '이미지 분석 중...': 12,
    '원단 물성 계산 중...': 18,
    '템플릿 매칭 중...': 22,
    '치수 융합 중...': 28,
    '치수 캘리브레이션 준비...': 35,
    '의류 형태 적용 중...': 55,
    '물리 시뮬레이션 중...': 62,
    '텍스처 GLB 생성 중...': 78,
    '렌더링 중...': 85,
    '품질 검사 중...': 95,
    '완료': 100,
  };

  function parseProgressData(data) {
    if (data.startsWith('PCT:') && data.includes('|')) {
      const pipe = data.indexOf('|');
      const pct = parseInt(data.slice(4, pipe), 10);
      const msg = data.slice(pipe + 1);
      return { pct: Number.isNaN(pct) ? null : pct, msg };
    }
    if (LEGACY_PCT[data] != null) {
      return { pct: LEGACY_PCT[data], msg: data };
    }
    return { pct: null, msg: data };
  }

  function showError(msg, retryJobId) {
    let html = `<p style="color:red;font-size:12px;text-align:center;">${msg || '렌더링 실패'}</p>`;
    if (retryJobId) {
      html += `<button class="btn btn-secondary" style="margin-top:12px;padding:10px 16px;font-size:12px;"
        onclick="retryJob('${retryJobId}')">다시 시도</button>`;
    }
    document.getElementById('avatarFigure').innerHTML = html;
  }

  async function retryJob(jobId) {
    try {
      document.getElementById('avatarFigure').innerHTML =
        '<p style="font-size:13px;text-align:center;color:var(--muted);">재시도 중...</p>';
      const res = await fetch(`/api/pipeline/retry/${jobId}`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || '재시도 실패');
      const p = new URLSearchParams(window.location.search);
      p.set('job_id', data.job_id);
      p.set('mode', 'pipeline');
      window.location.search = p.toString();
    } catch (e) {
      showError(e.message || '재시도 실패');
    }
  }

  function listenProgress(jobId, onDone) {
    const sse = new EventSource(`/api/fit/progress/${jobId}`);
    let finished = false;
    const poll = setInterval(async () => {
      try {
        const res = await fetch(`/api/pipeline/progress/${jobId}`);
        if (!res.ok) return;
        const p = await res.json();
        if (typeof p.percent === 'number') {
          setProgressUI(p.percent, p.message);
        }
      } catch (_) {}
    }, 800);

    const finish = () => {
      if (finished) return;
      finished = true;
      clearInterval(poll);
      try { sse.close(); } catch (_) {}
      setProgressUI(100, '완료');
      onDone();
    };
    sse.onmessage = (e) => {
      if (e.data === 'done') {
        finish();
      } else if (e.data === 'error') {
        finished = true;
        clearInterval(poll);
        try { sse.close(); } catch (_) {}
        showError('렌더링 실패');
      } else {
        const { pct, msg } = parseProgressData(e.data);
        setProgressUI(pct, msg);
      }
    };
    sse.onerror = () => {
      finish();
    };
  }

  function startLegacy() {
    fetch('/api/fit/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        height, weight,
        garment_type: type || 'tshirt',
        measurements: {
          shoulder: shoulder || undefined,
          sleeve:   sleeve   || undefined,
          chest:    chest    || undefined,
          length:   length   || undefined,
        },
        fabric
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.error) throw new Error(data.error);
      highlightAvatar(data.avatar_size);
      listenProgress(data.job_id, () => {
        showSilhouettes(data.images.silhouette_front);
        showReview(data.fit_analysis, data.summary, data.warnings);
      });
    })
    .catch(err => {
      console.error('API 오류:', err);
      showError('렌더링 실패');
    });
  }

  function startPipeline(jobId) {
    const frontUrl = `/outputs/${jobId}/silhouette_front.png`;
    listenProgress(jobId, async () => {
      try {
        let result = null;
        for (let i = 0; i < 40; i++) {
          const res = await fetch(`/api/pipeline/result/${jobId}`);
          if (res.status === 202) {
            await new Promise(r => setTimeout(r, 500));
            continue;
          }
          result = await res.json();
          break;
        }
        if (!result || result.status === 'error') {
          showError((result && result.error) || '파이프라인 실패', jobId);
          return;
        }
        if (result.status === 'needs_review') {
          // 결과는 보여주되 경고는 총평에
        }
        highlightAvatar(result.avatar_size);
        showSilhouettes(frontUrl);
        const fit = result.fit || {};
        const hints = (result.qa && result.qa.hints) || [];
        showReview(
          fit.fit_analysis,
          fit.summary || (result.fabric && result.fabric.summary_ko) || '',
          [...(result.warnings || []), ...hints]
        );
        // 결과 치수로 표 갱신
        const meas = fit.measurements || {};
        if (type === 'pants' || result.garment_type === 'pants') {
          document.getElementById('sizeTableHead').innerHTML = `<tr><th>허리</th><th>엉덩이</th><th>인심</th><th>총기장</th></tr>`;
          document.getElementById('sizeTable').innerHTML = `
            <tr>
              <td>${meas.waist || waist || '-'}</td>
              <td>${meas.hip || hip || '-'}</td>
              <td>${meas.inseam || inseam || '-'}</td>
              <td>${meas.length || length || '-'}</td>
            </tr>`;
        } else if (meas.shoulder || meas.chest) {
          document.getElementById('sizeTable').innerHTML = `
            <tr>
              <td>${meas.shoulder || shoulder || '-'}</td>
              <td>${meas.sleeve || sleeve || '-'}</td>
              <td>${meas.chest || chest || '-'}</td>
              <td>${meas.length || length || '-'}</td>
            </tr>`;
        }
        showMetaPanel(result);
      } catch (err) {
        console.error(err);
        showError('결과 로드 실패', jobId);
      }
    });
  }

  if (mode === 'pipeline' && jobIdParam) {
    startPipeline(jobIdParam);
  } else {
    startLegacy();
  }
</script>
</body>
</html>

name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  unit-and-cpu-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
      - name: Validate bench cases
        run: python scripts/validate_bench_cases.py
      - name: Unit tests
        env:
          PIPELINE_DISABLE_WORKER: "1"
        run: python -m unittest discover -s tests
      - name: CPU accuracy suites (strict)
        env:
          PIPELINE_DISABLE_WORKER: "1"
        run: >
          python scripts/run_accuracy_benchmark.py
          --no-blender --strict
          --suite classification
          --suite silhouette
          --suite neural_contract
          --case plant_calib_ok
